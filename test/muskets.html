<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Musket browser checks</title><style>body{margin:0;font:14px monospace;background:#faf7ef}.ledge{position:absolute;width:240px;height:40px;background:#ccc}#a{left:400px;top:340px}#b{left:620px;top:120px}pre{margin:500px 24px 0}</style></head><body><div class="ledge" id="a"></div><div class="ledge" id="b"></div><pre id="results">Running…</pre>
<script type="module">
import {createTurkeys} from '../dist/turkeys.mjs';
const results=[],originalRandom=Math.random;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const assert=(condition,name)=>{results.push({name,pass:!!condition});if(!condition)throw Error(name)};
const until=async(predicate,timeout=2500)=>{for(let elapsed=0;elapsed<timeout;elapsed+=20){if(predicate())return true;await wait(20)}return false};
let flock;
const shadow=()=>document.querySelector('tiny-turkeys').shadowRoot;
const pilgrim=()=>shadow().querySelector('[data-character="pilgrim"]');
const rotation=()=>Number(pilgrim().querySelector('.musket').getAttribute('transform').match(/rotate\(([-\d.]+)/)[1]);
async function setup(options={},reverse=false,shortTarget=false){
  Math.random=()=>reverse ? .8 : .4;
  flock=createTurkeys({characters:['pilgrim'],maxTurkeys:2,perchSelector:'.ledge',musketRange:600,shotAccuracy:0,shotInterval:[200,200],poopInterval:false,lifetime:[100000,100000],spawnInterval:[100000,100000],respectReducedMotion:false,...options});
  flock.start();await wait(80);
  Math.random=()=>reverse ? .4 : .8;
  if(shortTarget){let calls=0;Math.random=()=>++calls===5?0:.8;}
  flock.spawn('turkey');
}
try{
  await setup();
  assert(await until(()=>pilgrim().dataset.action==='aim'),'pilgrim acquires a nearby turkey');
  await wait(250);
  assert(rotation()<-20,'musket rotates upward toward a higher turkey');
  assert(pilgrim().querySelector('svg').style.transform==='scaleX(1)','pilgrim faces the target');
  assert(await until(()=>pilgrim().dataset.action==='fire'),'aiming ends with an attempted shot');
  assert(getComputedStyle(pilgrim().querySelector('.muzzle-flash')).display==='block','shot displays a tiny muzzle flash');
  let shot=shadow().querySelector('.shot');
  assert(shot&&shot.querySelector('.smoke')&&shot.querySelector('.pellet'),'shot creates a pellet and smoke puff');
  const firstPosition=shot.firstElementChild.style.transform;
  await wait(60);
  assert(shot.firstElementChild.style.transform!==firstPosition,'pellet travels away from the muzzle');
  flock.pause();const frozenPellet=shot.firstElementChild.style.transform,frozenAngle=rotation();await wait(200);
  assert(shot.firstElementChild.style.transform===frozenPellet&&rotation()===frozenAngle,'pause freezes projectiles and gun motion');
  flock.resume();
  assert(await until(()=>pilgrim().dataset.action==='reload'),'pilgrim reloads between shots');
  assert(flock.count===2,'missed turkeys remain alive and on the page');
  assert(await until(()=>!shadow().querySelector('.shot'),1500),'shot and smoke clean themselves up');
  flock.stop();assert(!document.querySelector('tiny-turkeys'),'stop removes all shot effects');
  await setup({},true);
  assert(await until(()=>pilgrim().dataset.action==='aim'),'pilgrim can acquire a turkey to its left');await wait(400);
  assert(rotation()>15&&pilgrim().querySelector('svg').style.transform==='scaleX(-1)','musket rotates down and mirrors correctly for a lower left target');
  flock.destroy();
  await setup({shotInterval:false});await wait(500);
  assert(!['aim','fire','reload'].includes(pilgrim().dataset.action)&&!shadow().querySelector('.shot'),'shot attempts can be disabled');flock.destroy();
  await setup({musketRange:80});await wait(500);
  assert(!['aim','fire'].includes(pilgrim().dataset.action),'out-of-range turkeys are not targeted');flock.destroy();
  await setup({lifetime:[450,100000]},false,true);
  assert(await until(()=>pilgrim().dataset.action==='aim'),'pilgrim starts aiming before target expires');
  await wait(600);
  assert(flock.count===1&&pilgrim().dataset.action!=='aim'&&!shadow().querySelector('.shot'),'disappearing targets cancel shots cleanly');flock.destroy();
  Math.random=()=>.6;
  flock=createTurkeys({characters:['pilgrim'],shotInterval:[100,100],respectReducedMotion:false});flock.start();await wait(500);
  assert(!['aim','fire'].includes(pilgrim().dataset.action)&&!shadow().querySelector('.shot'),'pilgrims do not shoot without turkey targets');flock.destroy();
  Math.random=()=>.99;
  flock=createTurkeys({characters:['turkey','pilgrim'],maxTurkeys:3,shotInterval:false,spawnInterval:[100000,100000],respectReducedMotion:false});flock.start();await wait(80);
  assert(shadow().querySelector('.bird').dataset.character==='turkey','mixed flocks always start with a turkey');
  flock.spawn();
  assert(shadow().querySelectorAll('.bird')[1].dataset.character==='pilgrim','later mixed arrivals can be pilgrims');
  flock.pause();flock.resume();flock.spawn();
  assert(shadow().querySelectorAll('.bird')[2].dataset.character==='pilgrim','resuming does not reset the first-arrival rule');
  flock.stop();flock.start();await wait(80);
  assert(shadow().querySelector('.bird').dataset.character==='turkey','a fresh restart begins with a turkey again');flock.destroy();
}catch(error){results.push({name:error.message,pass:false,error:error.stack})}
finally{Math.random=originalRandom;flock?.stop()}
window.testResults=results;document.querySelector('#results').textContent=results.map(r=>`${r.pass?'PASS':'FAIL'} ${r.name}`).join('\n');document.title=results.every(r=>r.pass)?'PASS — Muskets':'FAIL — Muskets';
</script></body></html>
