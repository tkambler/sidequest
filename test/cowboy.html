<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Cowboy browser checks</title><style>body{margin:0;font:14px monospace;background:#faf7ef}#page-button{position:absolute;left:40px;top:40px}#page-link{position:absolute;left:40px;top:90px}iframe{position:absolute;left:40px;top:140px;width:220px;height:80px}#ledge{position:fixed;left:600px;top:calc(100vh - 180px);width:300px;height:40px;background:#ccc}pre{margin:280px 30px 0}</style></head><body>
<button id="page-button">Page button</button><a href="#page-link-activated" id="page-link">Page link</a><iframe title="Embedded content" srcdoc="<button>Embedded button</button>"></iframe><div id="ledge"></div><pre id="results">Running…</pre>
<script type="module">
import {createTurkeys} from '../dist/sidequest.mjs';
const results=[],random=Math.random,wait=ms=>new Promise(r=>setTimeout(r,ms));
const assert=(condition,name)=>{results.push({name,pass:!!condition});if(!condition)throw Error(name)};
const until=async(predicate,timeout=2500)=>{for(let t=0;t<timeout;t+=20){if(predicate())return true;await wait(20)}return false};
const key=(type,key)=>window.dispatchEvent(new KeyboardEvent(type,{key,bubbles:true,cancelable:true}));
const mouse=(type,target,x,y)=>target.dispatchEvent(new PointerEvent(type,{clientX:x,clientY:y,pointerId:1,button:0,bubbles:true,composed:true,cancelable:true}));
let flock, clicks=0;const pageButton=document.querySelector('#page-button');pageButton.onclick=()=>clicks++;
const root=()=>document.querySelector('sidequest-turkeys').shadowRoot;
const rider=()=>root().querySelector('.cowboy');
const x=()=>new DOMMatrix(rider().style.transform).m41;
try{
  Math.random=()=>.75;
  flock=createTurkeys({maxTurkeys:1,autoShotInterval:false,cowboySpeed:2000,perchSelector:'#ledge',poopInterval:false,lifetime:[100000,100000],spawnInterval:[100000,100000],respectReducedMotion:false});
  flock.start();await wait(100);
  assert(root().querySelectorAll('.cowboy').length===1&&flock.count===1,'one cowboy mounts separately from the turkey count');
  assert(rider().tagName==='BUTTON'&&rider().getAttribute('aria-label'),'cowboy is a labeled keyboard-accessible button');
  const patrolX=x();await wait(180);
  assert(x()>patrolX,'cowboy slowly patrols without player input');
  assert(Math.abs(rider().getBoundingClientRect().bottom-innerHeight)<1,'cowboy stands on the viewport floor');
  assert(!root().querySelector('.shot'),'autonomous shooting can be disabled for manual play');
  pageButton.click();assert(clicks===1,'page clicks work during patrol');
  rider().click();assert(flock.controlled&&rider().getAttribute('aria-pressed')==='true','clicking cowboy enters control mode');
  const shield=root().querySelector('.cowboy-shield');
  const preview=root().querySelector('.trajectory-preview');
  assert(preview.hasAttribute('hidden'),'trajectory stays hidden until the mouse is held');
  assert(!shield.hidden,'control mode covers the page with a transparent input shield');
  pageButton.click();assert(clicks===1,'page button clicks are blocked during control');
  const hash=location.hash;document.querySelector('#page-link').click();assert(location.hash===hash,'page links cannot navigate during control');
  for(const type of ['dblclick','auxclick','contextmenu'])assert(!pageButton.dispatchEvent(new MouseEvent(type,{bubbles:true,composed:true,cancelable:true})),`${type} is consumed during control`);
  assert(document.elementFromPoint(100,180)!==document.querySelector('iframe'),'input shield also covers embedded page content');
  key('keydown','Escape');assert(!flock.controlled&&shield.hidden,'Escape leaves control mode and restores page input');
  rider().click();assert(flock.controlled,'cowboy can be selected again after Escape');
  const beforeLeft=x();key('keydown','a');await wait(40);
  const slowSpeed=Math.abs(Number(rider().dataset.velocity));
  const slowStride=parseFloat(getComputedStyle(rider().querySelector('.leg-a')).animationDuration);
  await wait(90);key('keyup','a');
  const fastSpeed=Math.abs(Number(rider().dataset.velocity));
  const fastStride=parseFloat(getComputedStyle(rider().querySelector('.leg-a')).animationDuration);
  assert(x()<beforeLeft,'A moves the cowboy left');
  assert(fastSpeed>slowSpeed,'holding A gradually builds movement speed');
  assert(fastStride<=slowStride,'leg cadence keeps up with actual speed while accelerating');
  const coastX=x();await wait(60);
  assert(x()<coastX&&Math.abs(Number(rider().dataset.velocity))<fastSpeed,'releasing a key coasts with decreasing speed');
  await wait(220);assert(rider().dataset.walking==='false','leg animation stops once momentum runs out');
  const beforeRight=x();key('keydown','d');await wait(350);key('keyup','d');assert(x()>beforeRight,'D moves the cowboy right');
  const reversingX=x();key('keydown','a');await wait(40);
  assert(Number(rider().dataset.velocity)>0&&x()>reversingX,'reversal brakes forward momentum before turning');
  await wait(250);key('keyup','a');assert(Number(rider().dataset.velocity)<0,'cowboy accelerates in the new direction after braking');
  await wait(260);
  key('keydown','a');key('keydown','d');const both=x();await wait(70);key('keyup','a');key('keyup','d');assert(Math.abs(x()-both)<1,'opposite movement keys cancel');
  const turkey=root().querySelector('[data-character="turkey"]');const box=turkey.getBoundingClientRect();
  const aimX=box.left+15,aimY=box.top+6;
  mouse('pointermove',shield,aimX,aimY);await wait(40);
  assert(/rotate\(-/.test(rider().querySelector('.rifle').getAttribute('transform')),'rifle points upward toward the mouse cursor');
  mouse('pointerdown',shield,aimX,aimY);await wait(160);
  const meter=root().querySelector('.charge-meter');
  assert(!meter.hidden&&Number(meter.getAttribute('aria-valuenow'))>0,'holding the mouse fills a visible shot-power meter');
  assert(!preview.hasAttribute('hidden')&&preview.getAttribute('aria-hidden')==='true','charging shows a decorative trajectory guide');
  assert(getComputedStyle(preview).pointerEvents==='none','trajectory cannot intercept pointer input');
  const weakLength=preview.querySelector('.trajectory-line').getTotalLength();
  const aimPath=preview.querySelector('.trajectory-line').getAttribute('d');
  mouse('pointermove',shield,aimX+80,aimY-50);await wait(40);
  assert(preview.querySelector('.trajectory-line').getAttribute('d')!==aimPath,'trajectory updates while aiming with the mouse');
  mouse('pointermove',shield,aimX,aimY);await wait(20);
  mouse('pointerup',shield,aimX,aimY);await wait(40);
  let weak=root().querySelector('.shot');
  assert(getComputedStyle(weak.querySelector('.smoke')).width==='7px'&&Number(weak.querySelector('.smoke').style.opacity)>0,'player shot emits a visible smoke puff');
  assert(weak&&Number(weak.dataset.power)<.3,'a short hold releases a weak shot');
  assert(meter.getAttribute('aria-valuenow')==='0','releasing resets the power meter');
  assert(preview.hasAttribute('hidden'),'releasing the mouse hides the trajectory');
  await wait(200);assert(root().querySelector('[data-character="turkey"]'),'weak ball falls short of the elevated turkey');
  mouse('pointerdown',shield,aimX,aimY);await wait(1650);
  assert(meter.getAttribute('aria-valuenow')==='100','long hold reaches full charge');
  assert(preview.querySelector('.trajectory-line').getTotalLength()>weakLength*2,'stronger charge visibly extends the guide');
  assert(Math.abs(root().querySelector('[data-character="turkey"]').getBoundingClientRect().bottom-(innerHeight-180))<1,'transparent input shield does not hide page perches from the scene');
  mouse('pointerup',shield,aimX,aimY);await wait(20);
  const full=[...root().querySelectorAll('.shot')].find(s=>Number(s.dataset.power)===1);
  assert(full,'release fires one full-strength ball');
  assert(await until(()=>root().querySelector('[data-character="roast"]')),'a player-fired ball can replace a turkey with a roast');
  assert(full.dataset.outcome==='hit','hit is determined by the travelling ball');
  mouse('pointerdown',shield,aimX,aimY);await wait(100);
  const shotCount=root().querySelectorAll('.shot').length;rider().click();
  assert(!flock.controlled&&meter.hidden&&shield.hidden,'clicking cowboy again exits and hides the controls');
  assert(root().querySelectorAll('.shot').length===shotCount,'exiting cancels a held charge without firing');
  pageButton.click();assert(clicks===2,'page clicks work again after leaving control mode');
  rider().click();key('keydown','a');await wait(1000);key('keyup','a');assert(x()===0,'player movement clamps at the left edge');
  key('keydown','d');await wait(1100);key('keyup','d');assert(Math.abs(x()-(innerWidth-48))<1,'player movement clamps at the right edge');
  mouse('pointerdown',shield,400,200);await wait(100);flock.pause();const pausedX=x();
  await wait(150);assert(x()===pausedX&&meter.hidden,'pause freezes movement and hides charge UI');
  assert(preview.hasAttribute('hidden'),'pausing cancels and hides the trajectory');
  flock.resume();const beforeRelease=root().querySelectorAll('.shot').length;mouse('pointerup',shield,400,200);
  assert(root().querySelectorAll('.shot').length===beforeRelease,'resuming does not fire a stale held charge');
  mouse('pointerdown',shield,400,200);await wait(50);window.dispatchEvent(new Event('blur'));mouse('pointerup',shield,400,200);
  assert(root().querySelectorAll('.shot').length===beforeRelease,'losing focus cancels charge');
  mouse('pointerdown',shield,400,200);await wait(60);key('keydown','Escape');
  assert(!flock.controlled&&meter.hidden&&shield.hidden,'Escape cancels a held shot and hides the controls');
  assert(preview.hasAttribute('hidden'),'Escape hides the trajectory immediately');
  const afterEscape=root().querySelectorAll('.shot').length;mouse('pointerup',shield,400,200);
  assert(root().querySelectorAll('.shot').length===afterEscape,'releasing after Escape cannot fire a stale shot');
  assert(getComputedStyle(rider()).outlineStyle!=='dashed','cowboy does not have a dashed focus outline');
  assert(getComputedStyle(root().querySelector('.cowboy-hint')).borderRadius==='3px','controls hint has 3px rounded corners');
  flock.stop();assert(!preview.isConnected,'stop removes the trajectory element');
  assert(!document.querySelector('sidequest-turkeys')&&!flock.controlled,'stop removes cowboy, shield, and control state');
  pageButton.click();assert(clicks===3,'stop removes the global click blockers');
  flock.start();await wait(80);assert(!flock.controlled&&root().querySelectorAll('.cowboy').length===1,'restart creates one fresh patrol cowboy');
  flock.destroy();
  flock=createTurkeys({cowboy:false,respectReducedMotion:false});flock.start();await wait(40);
  assert(!root().querySelector('.cowboy')&&!flock.controlled,'cowboy can be disabled for a decorative-only flock');flock.destroy();
}catch(error){results.push({name:error.message,pass:false,error:error.stack})}
finally{Math.random=random;flock?.stop()}
window.testResults=results;document.querySelector('#results').textContent=results.map(r=>`${r.pass?'PASS':'FAIL'} ${r.name}`).join('\n');document.title=results.every(r=>r.pass)?'PASS — Cowboy':'FAIL — Cowboy';
</script></body></html>
