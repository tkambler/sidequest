<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Santa pilot checks</title><style>body{margin:0;height:1800px;background:#faf7ef;font:14px monospace}#ledge{position:absolute;left:50px;top:400px;width:700px;height:40px;background:#345b4a}#results{position:absolute;top:500px;left:20px;white-space:pre-wrap}iframe{position:absolute;left:20px;top:60px;width:150px;height:60px}</style></head><body><button id="page-button">Page button</button><iframe title="Embedded page" srcdoc="<button>Embedded button</button>"></iframe><div id="ledge">A landing ledge</div><pre id="results">Running…</pre>
<script type="module">
import { createSantaGame } from '../dist/sidequest.mjs';
import { santaThrowPose } from '../src/santa-flight.js';
import { ballisticDirection, chargeVelocity } from '../src/ballistics.js';
const results=[], originalRandom=Math.random, originalRAF=requestAnimationFrame, originalCancel=cancelAnimationFrame, originalMatchMedia=window.matchMedia;
let callbacks=new Map(), sequence=0, clock=100, game;
window.requestAnimationFrame=fn=>{callbacks.set(++sequence,fn);return sequence};window.cancelAnimationFrame=id=>callbacks.delete(id);
const advance=async ms=>{for(let t=0;t<ms;t+=1000/60){clock+=1000/60;const batch=[...callbacks.values()];callbacks.clear();batch.forEach(fn=>fn(clock));if(t%1000<17)await Promise.resolve()}};
const assert=(condition,name)=>{results.push({name,pass:!!condition});if(!condition)throw Error(name)};
const root=()=>document.querySelector('sidequest-santa').shadowRoot;
const santa=()=>root().querySelector('.sleigh');
const key=(type,key,code='Key'+key.toUpperCase())=>document.body.dispatchEvent(new KeyboardEvent(type,{key,code,bubbles:true,cancelable:true}));
const pointer=(type,x=100,y=100,id=1)=>window.dispatchEvent(new PointerEvent(type,{clientX:x,clientY:y,pointerId:id,button:0,bubbles:true,cancelable:true}));
const position=()=>{const element=santa(),matrix=new DOMMatrix(element.style.transform),size=parseFloat(element.style.width);return{x:matrix.m41,y:matrix.m42+size*90/178,vx:0,vy:0,bank:parseFloat(element.style.transform.match(/rotate\(([-\d.]+)/)[1]),direction:Number(element.style.transform.match(/scaleX\(([-\d.]+)/)[1]),size}};
const start=async(options={})=>{game=createSantaGame({cowboy:false,maxChildren:1,spawnInterval:[100000,100000],lifetime:[100000,100000],giftLifetime:100000,visitInterval:[100,100],perchSelector:'#ledge',respectReducedMotion:false,...options});game.start();await advance(300)};
try{
  Math.random=()=>.9; await start();
  assert(santa()?.tagName==='BUTTON' && santa().getAttribute('aria-pressed')==='false','Santa is an accessible opt-in pilot button');
  assert(!game.controlled && root().querySelector('.game-shield').hidden,'autopilot leaves the page free');
  let clicks=0,typed=0;document.querySelector('#page-button').onclick=()=>clicks++;
  document.addEventListener('keydown',()=>typed++);
  document.querySelector('#page-button').click();assert(clicks===1,'page clicks work outside control mode');
  santa().click();assert(game.controlled && santa().getAttribute('aria-pressed')==='true','clicking Santa takes control');
  assert(root().activeElement===santa() && !root().querySelector('.santa-hud').hidden,'pilot receives focus and a controls HUD');
  document.querySelector('#page-button').click();key('keydown','x');assert(clicks===1 && typed===0,'pilot captures page clicks and ordinary keyboard input');
  const iframe=document.querySelector('iframe').getBoundingClientRect();
  assert(document.elementFromPoint(iframe.left+10,iframe.top+10)!==document.querySelector('iframe'),'input shield covers embedded content');
  assert(game.giftCount===0,'taking control cancels the pending automatic delivery');
  const initial=position();key('keydown','a');key('keydown','s');await advance(450);key('keyup','a');key('keyup','s');
  const steered=position();assert(steered.x<initial.x && steered.y>initial.y,'WASD steers in two dimensions with acceleration');
  await advance(150);const coast=position();assert(coast.x<steered.x && coast.y>=steered.y,'the sleigh coasts after keys are released');
  key('keydown','w');await advance(450);key('keyup','w');assert(position().y<coast.y,'W lifts the team');
  window.dispatchEvent(new Event('blur'));await advance(100);const stopped=position();await advance(100);
  assert(Math.abs(position().x-stopped.x)<.01 && Math.abs(position().y-stopped.y)<.01,'blur clears thrust and momentum');
  await advance(4000);assert(game.giftCount===0 && game.deliveredCount===0,'autopilot never delivers during player control');
  pointer('pointerdown',100,150);await advance(800);
  assert(santa().dataset.charging==='true' && !root().querySelector('.trajectory-preview').hasAttribute('hidden'),'charging shows a dotted trajectory guide');
  assert(Number(root().querySelector('.charge-meter').getAttribute('aria-valuenow'))>=50,'charge meter follows active time');
  game.pause();const frozen=position();key('keydown','d');pointer('pointerup');await advance(2000);
  assert(!game.airborneGiftCount && santa().dataset.charging==='false' && root().querySelector('.trajectory-preview').hasAttribute('hidden'),'pause cancels charge without throwing');
  assert(Math.abs(position().x-frozen.x)<.01,'pause freezes flight');game.resume();await advance(200);
  assert(Math.abs(position().x-frozen.x)<.01,'resuming does not retain paused key presses');
  pointer('pointerdown',100,150);await advance(1600);
  const child=root().querySelector('.child'),target=child.getBoundingClientRect();
  const p=position(),origin=santaThrowPose(p,p.size,{x:0,y:0}).muzzle;
  const aim=ballisticDirection(origin,{x:target.left+target.width/2,y:target.top+target.height/2},chargeVelocity(1));
  assert(aim,'waiting child is reachable by a charged present');
  const mouse={x:origin.x+aim.dx*300,y:origin.y+aim.dy*300};
  pointer('pointermove',mouse.x,mouse.y);pointer('pointerup',mouse.x,mouse.y);
  assert(game.airborneGiftCount===1 && santa().dataset.lastPower==='1.000','release launches one fully charged present from the hands');
  assert(root().querySelector('.trajectory-preview').hasAttribute('hidden'),'releasing hides the preview');
  for(let i=0;i<100 && !game.giftCount;i++)await advance(50);
  assert(game.giftCount===1 && game.deliveredCount===1 && game.waitingCount===0,'a physical player toss delivers to the waiting child');
  assert(root().querySelector('.santa-score').textContent==='1 present delivered','HUD reports completed deliveries');
  assert(root().querySelectorAll('.gift').length===1,'one wrapped present appears next to the child');
  await advance(500);pointer('pointerdown',200,0);await advance(400);pointer('pointerup',200,0);
  const missed=root().querySelector('.flying-gift');assert(missed,'another toss is allowed after the cooldown');
  await advance(7000);assert(game.deliveredCount===1 && game.giftCount===1 && !missed.isConnected,'misses and duplicate throws do not grant extra deliveries and clean up');
  pointer('pointerdown',100,150);await advance(500);pointer('pointercancel');pointer('pointerup');assert(!game.airborneGiftCount,'canceled pointers do not throw');
  pointer('pointerdown',100,150);await advance(500);window.dispatchEvent(new Event('blur'));pointer('pointerup');assert(!game.airborneGiftCount,'blur cancels a held gift');
  pointer('pointerdown',100,150);await advance(500);santa().click();
  assert(!game.controlled && !game.airborneGiftCount && root().querySelector('.game-shield').hidden,'clicking Santa hands back control without firing a charged gift');
  santa().click();key('keydown','Escape');assert(!game.controlled,'Escape restores automatic deliveries');
  santa().click();key('keydown',' ', 'Space');await advance(1600);key('keyup',' ', 'Space');assert(game.airborneGiftCount===1,'Space supports keyboard charging and tossing');
  game.stop();assert(!document.querySelector('sidequest-santa') && !game.controlled && !game.airborneGiftCount && game.deliveredCount===0,'stop removes pilot, projectiles, shield and score');
  document.querySelector('#page-button').click();key('keydown','x');assert(clicks===2 && typed===1,'stop removes page input capture');
  game.start();await advance(300);assert(!game.controlled && game.deliveredCount===0,'restart returns to fresh automatic deliveries');game.destroy();
  await start({interactive:false});assert(santa()?.tagName==='DIV' && !root().querySelector('.game-shield') && !game.controlled,'interactive false keeps Santa decorative');game.stop();
  await start();santa().click();await advance(100);
  Object.defineProperty(document,'hidden',{configurable:true,value:true});document.dispatchEvent(new Event('visibilitychange'));
  pointer('pointerdown');key('keydown','d');await advance(2000);
  delete document.hidden;document.dispatchEvent(new Event('visibilitychange'));const hiddenPosition=position();await advance(100);pointer('pointerup');
  assert(!game.airborneGiftCount && Math.abs(position().x-hiddenPosition.x)<.01,'hidden tabs cancel input and resume without stale thrust or a throw');game.stop();
  await start();santa().click();key('keydown','Escape');
  for(let i=0;i<500 && !game.deliveredCount;i++)await advance(100);
  assert(game.deliveredCount===1,'autopilot resumes actual deliveries after leaving control');game.stop();
  const motion=new EventTarget();motion.matches=false;
  window.matchMedia=query=>query==='(prefers-reduced-motion: reduce)'?motion:originalMatchMedia.call(window,query);
  await start({respectReducedMotion:true});santa().click();await advance(100);
  pointer('pointerdown',100,150);await advance(600);motion.matches=true;motion.dispatchEvent(new Event('change'));
  assert(!game.controlled && document.querySelector('sidequest-santa').hidden && !game.airborneGiftCount,'reduced motion cancels charge, hides the scene and exits pilot mode');
  const beforeReducedClick=clicks;document.querySelector('#page-button').click();assert(clicks===beforeReducedClick+1,'a hidden reduced-motion scene never captures page clicks');
  motion.matches=false;motion.dispatchEvent(new Event('change'));await advance(200);pointer('pointerup');
  assert(!game.controlled && !game.airborneGiftCount,'turning motion back on resumes autopilot without throwing');game.stop();window.matchMedia=originalMatchMedia;
}catch(error){results.push({name:error.message,pass:false,error:error.stack})}
finally{game?.stop();delete document.hidden;Math.random=originalRandom;window.requestAnimationFrame=originalRAF;window.cancelAnimationFrame=originalCancel;window.matchMedia=originalMatchMedia}
window.testResults=results;document.querySelector('#results').textContent=results.map(r=>`${r.pass?'PASS':'FAIL'} ${r.name}`).join('\n');document.title=results.every(r=>r.pass)?'PASS — Santa pilot':'FAIL — Santa pilot';
</script></body></html>
