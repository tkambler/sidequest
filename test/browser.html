<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Tiny Turkeys browser tests</title>
<style>body{margin:0;font:14px monospace;background:#faf7ef}#a,#b{position:absolute;width:240px;height:40px;left:100px;background:#ccc}#a{top:180px}#b{top:230px;left:300px}#ignored{position:absolute;top:120px;width:200px;left:10px}.spacer{height:1800px}pre{position:relative;margin:350px 24px 0}</style></head><body>
<div id="a" data-turkey-perch>A ledge</div><div id="b" data-turkey-perch>B ledge</div><div id="ignored" data-turkey-perch data-turkey-ignore>Ignored ledge</div><button id="click-target">Real button</button><pre id="results">Running…</pre><div class="spacer"></div>
<script type="module">
import { createTurkeys } from '../dist/turkeys.mjs';
const results = []; const wait = ms => new Promise(r => setTimeout(r,ms));
const assert = (condition, name) => { results.push({ name, pass: Boolean(condition) }); if (!condition) throw Error(name); };
const standardRandom = Math.random;
let flock;
try {
  flock = createTurkeys({ maxTurkeys: 3, spawnInterval: [100000,100000], lifetime: [100000,100000], perchSelector: '[data-turkey-perch]', respectReducedMotion: false });
  assert(document.querySelectorAll('tiny-turkeys').length === 0, 'opt-in: no overlay before start');
  flock.start(); await wait(150);
  const host = document.querySelector('tiny-turkeys');
  const bird = () => host.shadowRoot.querySelector('.bird');
  assert(flock.count === 1, 'first visitor arrives');
  assert(host.getAttribute('aria-hidden') === 'true' && getComputedStyle(host).pointerEvents === 'none', 'overlay is decorative and ignores clicks');
  let clicks = 0;
  document.querySelector('#click-target').onclick = () => clicks++;
  document.elementFromPoint(10,10).click();
  assert(clicks === 1, 'underlying button receives clicks');
  flock.start(); assert(document.querySelectorAll('tiny-turkeys').length === 1, 'start is idempotent');
  flock.pause(); const frozen = bird().style.transform; await wait(100);
  assert(bird().style.transform === frozen && !flock.spawn(), 'pause freezes movement and blocks arrivals');
  flock.resume();
  assert(flock.spawn() && flock.spawn() && !flock.spawn() && flock.count === 3, 'visitor cap applies to explicit spawns');
  flock.stop();
  assert(!document.querySelector('tiny-turkeys') && flock.count === 0 && !flock.running, 'stop removes overlay and visitors');
  flock.start(); await wait(100);
  assert(flock.count === 1 && document.querySelectorAll('tiny-turkeys').length === 1, 'restart creates a fresh flock');
  flock.destroy();
  let threw = false; try { flock.start(); } catch { threw = true; }
  assert(threw && !document.querySelector('tiny-turkeys'), 'destroy permanently stops flock');

  // Fixed random values force a known ledge and a jump, without waiting for chance.
  // A overlaps B's headroom; the 180px range reaches B's exposed right span.
  Math.random = () => .4;
  flock = createTurkeys({ maxTurkeys: 1, speed: 25, jumpDistance: 180, perchSelector: '[data-turkey-perch]', respectReducedMotion: false, lifetime:[100000,100000] });
  flock.start(); await wait(200);
  const host2 = document.querySelector('tiny-turkeys');
  const getBird = () => host2.shadowRoot.querySelector('.bird');
  let position = new DOMMatrix(getBird().style.transform);
  assert(Math.abs(position.m42 - 150) < 1, 'spawns atop exposed ledge; ignored ledge excluded');
  await wait(1400);
  assert(getBird().dataset.action === 'jump', 'chooses a nearby ledge and enters jump');
  for (let i = 0; i < 50 && getBird().dataset.action === 'jump'; i++) await wait(20);
  position = new DOMMatrix(getBird().style.transform);
  assert(Math.abs(position.m42 - 200) < 1 && position.m41 >= 300, 'lands on destination ledge');
  document.querySelector('#b').remove(); await wait(100);
  position = new DOMMatrix(getBird().style.transform);
  assert(Math.abs(position.m42 - (innerHeight - 30)) < 1, 'removed ledge safely relocates visitor');
  flock.stop();
  Math.random = () => .6;
  flock = createTurkeys({ maxTurkeys:1, perchSelector:'#a', respectReducedMotion:false, lifetime:[100000,100000] });
  flock.start(); await wait(100);
  scrollTo(0,80); await wait(100);
  position = new DOMMatrix(document.querySelector('tiny-turkeys').shadowRoot.querySelector('.bird').style.transform);
  assert(Math.abs(position.m42 - 70) < 1, 'perch tracks scrolling');
  flock.stop(); scrollTo(0,0);
  Math.random = () => .6;
  flock = createTurkeys({ maxTurkeys:1, perchSelector:'#a', respectReducedMotion:false, lifetime:[100000,100000] });
  flock.start(); await wait(1450);
  let movingBird = document.querySelector('tiny-turkeys').shadowRoot.querySelector('.bird');
  const beforeWalk = new DOMMatrix(movingBird.style.transform).m41;
  await wait(150);
  assert(movingBird.dataset.action === 'walk' && new DOMMatrix(movingBird.style.transform).m41 !== beforeWalk, 'walking moves visitors along their ledge');
  assert(getComputedStyle(movingBird.querySelector('.foot-a')).animationName === 'step', 'walking animates feet');
  flock.stop();
  Math.random = () => .8;
  flock = createTurkeys({ maxTurkeys:1, perchSelector:'#a', respectReducedMotion:false, lifetime:[100000,100000] });
  flock.start(); await wait(1850);
  movingBird = document.querySelector('tiny-turkeys').shadowRoot.querySelector('.bird');
  assert(movingBird.dataset.action === 'flap' && getComputedStyle(movingBird.querySelector('.wing')).animationName === 'flap', 'visitors occasionally flap their wings');
  flock.stop();
  flock = createTurkeys({ maxTurkeys: 1, lifetime: [150,150], spawnInterval:[100000,100000], respectReducedMotion:false });
  flock.start(); await wait(350);
  assert(flock.count === 0, 'visitors expire after their configured lifetime');
  flock.destroy();
  assert(!document.querySelector('tiny-turkeys'), 'all test overlays cleaned up');
  Math.random = () => .6;
  flock = createTurkeys({ characters: ['pilgrim'], maxTurkeys: 3, perchSelector:'#a', respectReducedMotion:false });
  flock.start(); await wait(150);
  let pilgrim = document.querySelector('tiny-turkeys').shadowRoot.querySelector('.bird');
  assert(pilgrim.dataset.character === 'pilgrim' && pilgrim.querySelector('.musket'), 'pilgrim arrivals carry a musket');
  assert(pilgrim.style.width === '30px' && pilgrim.querySelector('svg').style.transform === 'scaleX(1)', 'pilgrim has correct size and faces its travel direction');
  assert(flock.spawn('turkey') && flock.spawn('pilgrim') && !flock.spawn('pilgrim'), 'explicit character spawns share the visitor cap');
  const types = [...document.querySelector('tiny-turkeys').shadowRoot.querySelectorAll('.bird')].map(node => node.dataset.character);
  assert(types.join(',') === 'pilgrim,turkey,pilgrim', 'different characters coexist in one overlay');
  await wait(1350);
  assert(pilgrim.dataset.action === 'walk' && getComputedStyle(pilgrim.querySelector('.musket')).animationName === 'carry', 'pilgrim walks while carrying the musket');
  flock.stop();
  Math.random = () => .8;
  flock = createTurkeys({characters:['pilgrim'],perchSelector:'#a',respectReducedMotion:false});
  flock.start(); await wait(1750);
  pilgrim = document.querySelector('tiny-turkeys').shadowRoot.querySelector('.bird');
  assert(pilgrim.dataset.action === 'idle' && !pilgrim.querySelector('.wing'), 'pilgrim rests instead of flapping wings');
  flock.destroy();
  // Restore the nearby ledge and force a pilgrim hop.
  const destination = document.createElement('div');
  destination.id = 'b'; destination.dataset.turkeyPerch = ''; document.body.append(destination);
  Math.random = () => .4;
  flock = createTurkeys({characters:['pilgrim'],jumpDistance:180,perchSelector:'[data-turkey-perch]',respectReducedMotion:false});
  flock.start(); await wait(1550);
  pilgrim = document.querySelector('tiny-turkeys').shadowRoot.querySelector('.bird');
  assert(pilgrim.dataset.action === 'jump', 'pilgrim hops between nearby ledges');
  for (let i=0;i<50 && pilgrim.dataset.action === 'jump';i++) await wait(20);
  assert(Math.abs(new DOMMatrix(pilgrim.style.transform).m42 - 200) < 1, 'pilgrim lands on destination ledge');
  flock.destroy();
  assert(!document.querySelector('tiny-turkeys'), 'mixed visitors clean up completely');
  Math.random = () => .6;
  flock = createTurkeys({perchSelector:'#a',maxTurkeys:1,poopInterval:[150,150],poopLifetime:400,lifetime:[300,300],spawnInterval:[100000,100000],respectReducedMotion:false});
  flock.start(); await wait(220);
  let poopHost = document.querySelector('tiny-turkeys');
  let dropping = poopHost.shadowRoot.querySelector('.dropping');
  assert(dropping && poopHost.shadowRoot.querySelector('.bird').dataset.action === 'poop', 'turkey pauses to leave a tiny dropping');
  assert(getComputedStyle(dropping).width === '5px' && getComputedStyle(dropping).pointerEvents === 'none', 'dropping is tiny and ignores clicks');
  const dropY = new DOMMatrix(dropping.style.transform).m42;
  scrollTo(0,40); await wait(100);
  assert(Math.abs(new DOMMatrix(dropping.style.transform).m42 - (dropY - 40)) < 1, 'dropping tracks its ledge while scrolling');
  flock.pause(); await wait(450);
  assert(dropping.isConnected, 'pause freezes dropping lifetime');
  flock.resume(); await wait(500);
  assert(!poopHost.shadowRoot.querySelector('.dropping'), 'droppings expire automatically');
  flock.destroy(); scrollTo(0,0);
  for (const options of [{characters:['pilgrim'],poopInterval:[100,100]}, {poopInterval:false}]) {
    flock = createTurkeys({...options,perchSelector:'#a',respectReducedMotion:false});
    flock.start(); await wait(250);
    assert(!document.querySelector('tiny-turkeys').shadowRoot.querySelector('.dropping'), options.poopInterval === false ? 'droppings can be disabled' : 'pilgrims do not leave droppings');
    flock.destroy();
  }
  flock = createTurkeys({perchSelector:'#a',poopInterval:[150,150],respectReducedMotion:false});
  flock.start(); await wait(230);
  poopHost = document.querySelector('tiny-turkeys');
  assert(poopHost.shadowRoot.querySelector('.dropping'), 'dropping exists before ledge removal');
  document.querySelector('#a').remove(); await wait(40);
  assert(!poopHost.shadowRoot.querySelector('.dropping'), 'removed ledge also removes its droppings');
  await wait(200);
  assert(poopHost.shadowRoot.querySelector('.dropping'), 'turkey can leave a dropping on viewport floor');
  flock.stop();
  assert(!poopHost.isConnected && !document.querySelector('tiny-turkeys'), 'stop removes droppings with the overlay');
} catch (error) { results.push({name:error.message, pass:false, error:error.stack}); }
finally { Math.random = standardRandom; flock?.stop(); }
window.testResults = results;
document.querySelector('#results').textContent = results.map(r => `${r.pass ? 'PASS' : 'FAIL'} ${r.name}`).join('\n');
document.title = results.every(r=>r.pass) ? 'PASS — Tiny Turkeys' : 'FAIL — Tiny Turkeys';
</script></body></html>
